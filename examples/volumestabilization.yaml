# Example VolumeStabilization CR
# This stabilizes the dynamically created PVC to a predictable name
apiVersion: synology.csi.io/v1
kind: VolumeStabilization
metadata:
  name: stabilize-my-app-data
  namespace: default
spec:
  # Reference to the dynamically created PVC
  sourcePVC:
    name: my-app-data-dynamic  # The PVC created by CSI driver
    namespace: default         # Optional, defaults to CR namespace
  
  # Target configuration for the stabilized volume
  target:
    pvcName: my-app-data       # Your desired predictable PVC name
    namespace: default         # Optional, defaults to source namespace
    # storageClassName: nfs-synology  # Optional: override the stable PVC storage class.
    # Leave unset to preserve the original storage class so normal PVC expansion keeps working.
    # Set to "" only if you explicitly want static non-resizable binding.
    # pvName: my-custom-pv     # Optional: custom PV name (auto-generated if not specified)

    # Desired capacity (v0.1.9+). Change this number and `kubectl apply` to GROW the volume.
    # Grow-only, unit required ("30Gi", not "30"). Watch it with: kubectl get vs
    # size: 30Gi
  
  # Preserve original PVC metadata
  preserveAnnotations: true
  preserveLabels: true
  
  # Wait for original PVC/PV to be fully deleted before creating new ones
  waitForDeletion: true

  # Deletion protection: when true, kubectl delete on this CR will be blocked
  # until you explicitly set this to false first.
  # Safeguard against accidental kubectl delete -f on a manifests folder.
  # To delete: kubectl patch vs stabilize-my-app-data --type=merge -p '{"spec":{"deletionProtection":false}}'
  deletionProtection: true
