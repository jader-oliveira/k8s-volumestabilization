apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-stabilization-operator
  namespace: volume-stabilization
  labels:
    app.kubernetes.io/name: volume-stabilization-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/version: "v0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: volume-stabilization-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volume-stabilization-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: volume-stabilization-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: jaderoliver/volume-stabilization-operator:v0.1.3
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
