# Volume Stabilization Operator — full install
# Apply once on a new cluster:
#
#   kubectl apply -f quickstart/operator.yaml
#
# Then wait for the operator to be ready:
#
#   kubectl rollout status deployment/volume-stabilization-operator \
#     -n volume-stabilization --timeout=90s

---
# 1. CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: volumestabilizations.synology.csi.io
  labels:
    app.kubernetes.io/name: volume-stabilization-operator
spec:
  group: synology.csi.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - sourcePVC
                - target
              properties:
                sourcePVC:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                target:
                  type: object
                  required:
                    - pvcName
                  properties:
                    pvcName:
                      type: string
                    namespace:
                      type: string
                    storageClassName:
                      type: string
                preserveAnnotations:
                  type: boolean
                  default: true
                preserveLabels:
                  type: boolean
                  default: true
                waitForDeletion:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Discovering", "Capturing", "DeletingOriginal", "Creating", "Bound", "Failed"]
                originalPV:
                  type: object
                  properties:
                    name:
                      type: string
                    server:
                      type: string
                    path:
                      type: string
                    storage:
                      type: string
                    accessModes:
                      type: array
                      items:
                        type: string
                    storageClassName:
                      type: string
                    reclaimPolicy:
                      type: string
                    mountOptions:
                      type: array
                      items:
                        type: string
                newPV:
                  type: object
                  properties:
                    name:
                      type: string
                newPVC:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
      additionalPrinterColumns:
        - name: Source PVC
          type: string
          jsonPath: .spec.sourcePVC.name
        - name: Target PVC
          type: string
          jsonPath: .spec.target.pvcName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: volumestabilizations
    singular: volumestabilization
    kind: VolumeStabilization
    shortNames:
      - vs
      - volstab

---
# 2. Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: volume-stabilization
  labels:
    app.kubernetes.io/name: volume-stabilization-operator

---
# 3. ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-stabilization-operator
  namespace: volume-stabilization
  labels:
    app.kubernetes.io/name: volume-stabilization-operator

---
# 4. ClusterRole — needs PV/PVC/VS access cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volume-stabilization-operator
  labels:
    app.kubernetes.io/name: volume-stabilization-operator
rules:
- apiGroups: ["synology.csi.io"]
  resources: ["volumestabilizations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["synology.csi.io"]
  resources: ["volumestabilizations/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["synology.csi.io"]
  resources: ["volumestabilizations/finalizers"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
# 5. ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volume-stabilization-operator
  labels:
    app.kubernetes.io/name: volume-stabilization-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volume-stabilization-operator
subjects:
- kind: ServiceAccount
  name: volume-stabilization-operator
  namespace: volume-stabilization

---
# 6. Role — leader election (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volume-stabilization-operator-leader-election
  namespace: volume-stabilization
  labels:
    app.kubernetes.io/name: volume-stabilization-operator
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
# 7. RoleBinding — leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volume-stabilization-operator-leader-election
  namespace: volume-stabilization
  labels:
    app.kubernetes.io/name: volume-stabilization-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volume-stabilization-operator-leader-election
subjects:
- kind: ServiceAccount
  name: volume-stabilization-operator
  namespace: volume-stabilization

---
# 8. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-stabilization-operator
  namespace: volume-stabilization
  labels:
    app.kubernetes.io/name: volume-stabilization-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: volume-stabilization-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volume-stabilization-operator
    spec:
      serviceAccountName: volume-stabilization-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
          image: jaderoliver/volume-stabilization-operator:v0.1.4
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
