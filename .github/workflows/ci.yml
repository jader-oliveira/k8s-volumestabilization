name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platform(s) to build'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64

# Least-privilege defaults; individual jobs extend as needed
permissions:
  contents: read

env:
  GO_VERSION: '1.21'
  IMAGE_NAME: jaderoliver/volume-stabilization-operator

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Lint — code style + static analysis
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false   # golangci-lint manages its own cache

      - name: Tidy dependencies
        working-directory: operator
        run: go mod tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: operator

  # ──────────────────────────────────────────────────────────────────
  # 2. Test — unit tests + race detector + coverage
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tidy dependencies
        working-directory: operator
        run: go mod tidy

      - name: Run tests
        working-directory: operator
        run: go test -race -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: operator/coverage.out
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────
  # 3. Security — known CVEs in deps + static security analysis
  # ──────────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tidy dependencies
        working-directory: operator
        run: |
          go get golang.org/x/net@latest   # patch http2 CVEs in transitive deps
          go mod tidy

      - name: govulncheck (known CVEs in Go deps)
        uses: golang/govulncheck-action@v1
        continue-on-error: true   # report CVEs as annotations; don't block the pipeline
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...
          work-dir: operator
          repo-checkout: false   # we already checked out above; avoids git clean nuking go.sum

      - name: gosec (static security analysis)
        if: always()   # run even if govulncheck found CVEs
        working-directory: operator
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name != 'pull_request' && hashFiles('operator/gosec-results.sarif') != ''
        with:
          sarif_file: operator/gosec-results.sarif
          category: gosec

  # ──────────────────────────────────────────────────────────────────
  # 4. Build — multi-arch image; push + scan + sign on non-PR
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: write          # GitHub Release creation
      id-token: write          # Cosign keyless signing via OIDC
      security-events: write   # Trivy SARIF upload
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Volume Stabilization Operator
            org.opencontainers.image.description=Kubernetes operator for stable NFS PVC names
            org.opencontainers.image.vendor=jaderoliver

      - name: Build (and push on non-PR)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: operator
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true    # SLSA build provenance attestation
          sbom: true          # Software Bill of Materials

      # Scan the pushed image for known CVEs — reports to Security tab, does not block
      - name: Trivy image scan
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # skip CVEs with no fix available yet
          exit-code: '0'        # report only; Trivy findings go to GitHub Security tab

      - name: Upload Trivy results to GitHub Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Keyless signing via Sigstore — ties image digest to this workflow run
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${DIGEST}"

      # Auto-generate release notes from commits when a vX.Y.Z tag is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
