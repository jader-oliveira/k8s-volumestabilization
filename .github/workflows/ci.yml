name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platform(s) to build'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64

# Least-privilege defaults; individual jobs extend as needed
permissions:
  contents: read

env:
  GO_VERSION: '1.21'
  IMAGE_NAME: jaderoliver/volume-stabilization-operator

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Lint — code style + static analysis
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false   # golangci-lint manages its own cache

      - name: Tidy dependencies
        working-directory: operator
        run: go mod tidy

      - name: golangci-lint
        id: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: operator
          args: --out-format=colored-line-number,html:lint-report.html
        continue-on-error: true

      - name: Job Summary — Lint
        if: always()
        run: |
          STATUS="${{ steps.lint.outcome }}"
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ${ICON} Lint Report
          | | |
          |---|---|
          | **Tool** | golangci-lint (latest) |
          | **Result** | ${STATUS^^} |
          | **Artifact** | [lint-report.html](#artifacts) |

          > Issues (if any) are shown as inline PR annotations and in the HTML report artifact.
          EOF
          [ "$STATUS" != "success" ] && exit 1 || exit 0

      - name: Upload lint HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: operator/lint-report.html
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────
  # 2. Test — unit tests + race detector + coverage
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tidy dependencies
        working-directory: operator
        run: go mod tidy

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests
        id: tests
        working-directory: operator
        run: |
          gotestsum \
            --format testname \
            --junitfile test-results.xml \
            -- -race -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic ./...
        continue-on-error: true

      - name: Generate HTML test report
        if: always()
        working-directory: operator
        run: |
          go install github.com/vakenbolt/go-test-report@latest
          go test -json -race -count=1 ./... 2>/dev/null | go-test-report -o test-report.html -t "Volume Stabilization Operator — Test Results" || true

      - name: Compute coverage percentage
        id: coverage
        if: always()
        working-directory: operator
        run: |
          if [ -f coverage.out ]; then
            PCT=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          else
            PCT="N/A"
          fi
          echo "pct=$PCT" >> $GITHUB_OUTPUT

      - name: Job Summary — Tests
        if: always()
        run: |
          STATUS="${{ steps.tests.outcome }}"
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          COV="${{ steps.coverage.outputs.pct }}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ${ICON} Test Report
          | | |
          |---|---|
          | **Result** | ${STATUS^^} |
          | **Coverage** | ${COV} |
          | **Race detector** | enabled |
          | **Artifact** | [test-report.html](#artifacts) · [JUnit XML](#artifacts) |
          EOF
          [ "$STATUS" != "success" ] && exit 1 || exit 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            operator/test-report.html
            operator/test-results.xml
            operator/coverage.out
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: operator/coverage.out
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────
  # 3. Security — known CVEs in deps + static security analysis
  # ──────────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tidy dependencies
        working-directory: operator
        run: |
          go get golang.org/x/net@latest   # patch http2 CVEs in transitive deps
          go mod tidy

      - name: govulncheck (known CVEs in Go deps)
        id: govuln
        uses: golang/govulncheck-action@v1
        continue-on-error: true   # report CVEs as annotations; don't block the pipeline
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...
          work-dir: operator
          repo-checkout: false   # we already checked out above; avoids git clean nuking go.sum

      - name: gosec (static security analysis)
        id: gosec
        if: always()   # run even if govulncheck found CVEs
        working-directory: operator
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./... || true
          gosec -fmt html  -out gosec-report.html  ./... || true

      - name: Job Summary — Security
        if: always()
        run: |
          VULN="${{ steps.govuln.outcome }}"
          SEC="${{ steps.gosec.outcome }}"
          VULN_ICON=$([ "$VULN" = "success" ] && echo "✅" || echo "⚠️")
          SEC_ICON=$([ "$SEC" = "success" ] && echo "✅" || echo "⚠️")
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🔐 Security Report
          | Check | Status | Details |
          |---|---|---|
          | **govulncheck** (CVEs in Go deps) | ${VULN_ICON} ${VULN^^} | See annotations above |
          | **gosec** (static analysis) | ${SEC_ICON} ${SEC^^} | [gosec-report.html](#artifacts) |

          > CVE findings are non-blocking — they are reported in the GitHub Security tab and HTML artifact.
          > Fix by upgrading vulnerable dependencies.
          EOF

      - name: Upload gosec HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            operator/gosec-report.html
            operator/gosec-results.sarif
          retention-days: 30

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name != 'pull_request' && hashFiles('operator/gosec-results.sarif') != ''
        with:
          sarif_file: operator/gosec-results.sarif
          category: gosec

  # ──────────────────────────────────────────────────────────────────
  # 4. Build — multi-arch image; push + scan + sign on non-PR
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: write          # GitHub Release creation
      id-token: write          # Cosign keyless signing via OIDC
      security-events: write   # Trivy SARIF upload
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Volume Stabilization Operator
            org.opencontainers.image.description=Kubernetes operator for stable NFS PVC names
            org.opencontainers.image.vendor=jaderoliver

      - name: Build (and push on non-PR)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: operator
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true    # SLSA build provenance attestation
          sbom: true          # Software Bill of Materials

      # Scan the pushed image for known CVEs — reports to Security tab, does not block
      - name: Trivy image scan (SARIF → Security tab)
        id: trivy
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy image scan (HTML report)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-report.html
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Job Summary — Build
        if: always()
        run: |
          BUILD="${{ steps.build.outcome }}"
          BUILD_ICON=$([ "$BUILD" = "success" ] && echo "✅" || echo "❌")
          DIGEST="${{ steps.build.outputs.digest }}"
          SHORT_DIGEST=$(echo "$DIGEST" | cut -c1-19)
          PLATFORMS="${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🐳 Build Report
          | | |
          |---|---|
          | **Result** | ${BUILD_ICON} ${BUILD^^} |
          | **Image** | \`${{ env.IMAGE_NAME }}\` |
          | **Digest** | \`${SHORT_DIGEST}...\` |
          | **Platforms** | \`${PLATFORMS}\` |
          | **Signed** | ✅ Cosign keyless (Sigstore) |
          | **SBOM** | ✅ Attached to image |
          | **Trivy scan** | [trivy-report.html](#artifacts) · [GitHub Security tab](../security/code-scanning) |
          EOF

      - name: Upload Trivy HTML report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: |
            trivy-report.html
            trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy results to GitHub Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Keyless signing via Sigstore — ties image digest to this workflow run
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${DIGEST}"

      # Auto-generate release notes from commits when a vX.Y.Z tag is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
